# A pull request is squash-merged with its title as the commit message, so the title follows
# Conventional Commits, as every commit does. The title is only read from the event, never run,
# so pull_request_target is safe and needs no approval for a first-time contributor.
name: Pull request title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|style|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ](.*[^. ])?$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "\"$TITLE\" is a Conventional Commit."
          else
            echo "::error::The title \"$TITLE\" is not a Conventional Commit. Write it as <type>[(<scope>)][!]: <description>, such as \"fix(ems): a video without audio gets its thumbnail\", with a type of feat, fix, perf, refactor, test, docs, build, ci, style, chore or revert, and no trailing period."
            exit 1
          fi
